name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Faz o build da imagem da aplicacao
        run: docker build -t felipetech1/desafio-devops-app:${{ github.sha }} ./node

      - name: Start dos servicos
        run: APP_IMAGE_TAG=${{ github.sha }} docker compose up -d

      - name: Testa a aplicacao
        run: |
          sleep 10
          curl --fail http://localhost:8080
  
      - name: Publica imagem no Docker Hub
        run: docker push felipetech1/desafio-devops-app:${{ github.sha }}

      - name: Atualiza a imagem no manifest de deploy
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: felipetech1/desafio-devops-app:.*|image: felipetech1/desafio-devops-app:${{ github.sha }}|" k8s/app-deployment.yaml

      - name: Commita e publica a atualizacao do manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/app-deployment.yaml

          if git diff --staged --quiet; then
            echo "Manifest ja aponta para ${{ github.sha }}, nada a commitar."
            exit 0
          fi

          git commit -m "chore: atualiza imagem da aplicacao para ${{ github.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}