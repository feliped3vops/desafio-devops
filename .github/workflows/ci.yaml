name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Faz o build da imagem da aplicacao
        run: docker compose build app

      - name: Start dos servicos
        run: docker compose up -d

      - name: Testa a aplicacao
        run: |
          sleep 10
          curl --fail http://localhost:8080