apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: desafio-devops
  namespace: desafio-devops
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80