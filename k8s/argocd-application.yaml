apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: desafio-devops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/feliped3vops/desafio-devops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: desafio-devops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true